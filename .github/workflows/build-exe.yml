name: Build Windows app

# Builds the .exe on every push to main and publishes it as a GitHub release
# named after the version in package.json. Bump "version" to make a new release.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Build .exe
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -o pipefail
          npx electron-builder --win --x64 --publish never 2>&1 | tee build.log || {
            # Surface the real error as annotations so it shows on the run summary.
            grep -iE "error|⨯|failed|cannot" build.log | tail -15 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: HOLLOWCAST-windows
          path: dist/*.exe
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: HOLLOWCAST ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*.exe
          body: |
            **Download `HOLLOWCAST-${{ steps.ver.outputs.version }}-portable.exe`** to run it without installing,
            or the setup `.exe` to install it with a Start menu shortcut.

            Windows may say the app is from an unknown publisher because it is not code-signed:
            click **More info → Run anyway**.
